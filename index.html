<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2e1f">
<title>Field Capture</title>
<style>
  :root {
    --bg: #10201a;
    --surface: #1a2e24;
    --surface-2: #24402f;
    --edge: #35543f;
    --fruit: #e8622c;
    --fruit-soft: #f2894f;
    --gold: #f0b429;
    --text: #eef4ec;
    --text-dim: #9db3a4;
    --ok: #4ade80;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Roboto Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  .wrap { flex: 1; display: flex; flex-direction: column; max-width: 560px; width: 100%; margin: 0 auto; }
  header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--edge);
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, var(--fruit-soft), var(--fruit));
    position: relative;
  }
  .logo::after {
    content: ""; position: absolute; inset: 0; border-radius: 9px;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25);
  }
  .brand { line-height: 1.1; }
  .brand b { font-size: 15px; letter-spacing: .2px; display: block; font-weight: 650; }
  .brand span { font-size: 11px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; }
  .netdot { margin-left: auto; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .netdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; }
  .netdot.online i { background: var(--ok); }
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; }
  .screen { display: none; flex-direction: column; flex: 1; animation: fade .25s ease; }
  .screen.active { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; }
  .sample-box {
    background: var(--surface); border: 1px solid var(--edge); border-radius: 16px;
    padding: 22px; margin-bottom: 18px;
  }
  .sample-input { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .sample-input .pfx { font-family: var(--mono); color: var(--fruit-soft); font-size: 22px; font-weight: 600; }
  .sample-input input {
    flex: 1; background: var(--bg); border: 1px solid var(--edge); border-radius: 12px;
    color: var(--text); font-size: 30px; font-family: var(--mono); font-weight: 600;
    padding: 12px 16px; text-align: center; letter-spacing: 1px;
  }
  .sample-input input:focus { outline: none; border-color: var(--fruit); }
  .hint { font-size: 12.5px; color: var(--text-dim); margin-top: 12px; line-height: 1.5; }
  .faces { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .face-cell {
    background: var(--surface); border: 1px solid var(--edge); border-radius: 14px;
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; position: relative; overflow: hidden; cursor: pointer; transition: border-color .15s;
  }
  .face-cell:active { transform: scale(.985); }
  .face-cell.done { border-color: var(--ok); }
  .face-cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .face-cell .n { font-size: 13px; color: var(--text-dim); letter-spacing: .5px; z-index: 2; }
  .face-cell .ico { font-size: 30px; z-index: 2; opacity: .5; }
  .face-cell .check {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #06231a;
    display: none; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
  }
  .face-cell.done .check { display: flex; }
  .face-cell.done .n, .face-cell.done .ico { opacity: 0; }
  .face-cell .retake {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
    font-size: 11px; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 20px;
    display: none;
  }
  .face-cell.done .retake { display: block; }
  .btn {
    border: none; border-radius: 13px; font-family: var(--font); font-size: 16px; font-weight: 600;
    padding: 16px; width: 100%; cursor: pointer; transition: opacity .15s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.99); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--fruit); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--edge); }
  main .btn { margin-top: auto; }
  .confirm-hero { text-align: center; padding: 30px 0 24px; }
  .confirm-hero .big {
    width: 76px; height: 76px; border-radius: 50%; background: rgba(74,222,128,.14);
    border: 2px solid var(--ok); color: var(--ok); font-size: 40px;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .confirm-hero h2 { font-size: 21px; font-weight: 650; margin-bottom: 6px; }
  .confirm-hero p { color: var(--text-dim); font-size: 14px; }
  .saved-list {
    background: var(--surface); border: 1px solid var(--edge); border-radius: 14px;
    padding: 6px 16px; margin-bottom: 18px;
  }
  .saved-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--edge); font-size: 14px;
  }
  .saved-row:last-child { border-bottom: none; }
  .saved-row .tick { color: var(--ok); font-weight: 700; }
  .saved-row .fn { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); margin-left: auto; }
  .storage-tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tag {
    font-size: 12px; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--edge); color: var(--text-dim);
  }
  .tag.on { color: var(--ok); border-color: rgba(74,222,128,.4); }
  .tag.off { color: var(--gold); border-color: rgba(240,180,41,.3); }
  .lib-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .lib-head h2 { font-size: 17px; font-weight: 650; }
  .lib-count { font-size: 12px; color: var(--text-dim); }
  .lib-item {
    background: var(--surface); border: 1px solid var(--edge); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
  }
  .lib-thumb { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; background: var(--bg); flex-shrink: 0; }
  .lib-meta b { font-size: 15px; font-family: var(--mono); }
  .lib-meta small { display: block; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .lib-meta .cloud { color: var(--gold); }
  .lib-meta .cloud.synced { color: var(--ok); }
  .lib-empty { text-align: center; color: var(--text-dim); padding: 50px 20px; font-size: 14px; line-height: 1.6; }
  nav {
    display: flex; border-top: 1px solid var(--edge); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--text-dim); padding: 12px 0 14px;
    font-family: var(--font); font-size: 11px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  nav button .ni { font-size: 20px; }
  nav button.active { color: var(--fruit-soft); }
  .cam {
    position: fixed; inset: 0; background: #000; z-index: 50; display: none;
    flex-direction: column;
  }
  .cam.active { display: flex; }
  .cam video { flex: 1; width: 100%; object-fit: cover; }
  .cam-top {
    position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; z-index: 3;
    background: linear-gradient(rgba(0,0,0,.6), transparent);
  }
  .cam-top .ctitle { font-size: 15px; font-weight: 600; }
  .cam-top .csub { font-size: 12px; color: rgba(255,255,255,.7); }
  .cam-close { background: rgba(0,0,0,.4); border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; }
  .cam-guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 74vw; max-width: 340px; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,.5);
    border-radius: 20px; z-index: 2; pointer-events: none;
  }
  .cam-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  .shutter {
    width: 74px; height: 74px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,.4);
    cursor: pointer;
  }
  .shutter:active { transform: scale(.93); }
  canvas { display: none; }
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--edge); color: var(--text);
    padding: 12px 20px; border-radius: 30px; font-size: 13.5px; z-index: 60;
    opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div class="brand"><b>Field Capture</b><span>Samples · R&D</span></div>
    <div class="netdot" id="netdot"><i></i><span id="netlabel">Hors ligne</span></div>
  </header>
  <main>
    <section class="screen active" id="screen-capture">
      <div class="sample-box">
        <div class="label">Numéro d'échantillon</div>
        <div class="sample-input">
          <span class="pfx">Ech</span>
          <input type="number" id="sampleNo" inputmode="numeric" placeholder="1" min="1">
        </div>
        <div class="hint">Saisis le numéro du fruit tel que sur ta fiche NIR. Les 4 photos porteront ce numéro.</div>
      </div>
      <div class="label">Les 4 faces du fruit</div>
      <div class="faces" id="faceGrid"></div>
      <button class="btn btn-primary" id="saveBtn" disabled>Enregistrer l'échantillon</button>
    </section>
    <section class="screen" id="screen-confirm">
      <div class="confirm-hero">
        <div class="big">✓</div>
        <h2 id="confirmTitle">Échantillon 1 enregistré</h2>
        <p>Les 4 photos sont sauvegardées.</p>
      </div>
      <div class="saved-list" id="savedList"></div>
      <div class="storage-tags" id="storageTags"></div>
      <button class="btn btn-primary" id="nextSampleBtn">Échantillon suivant</button>
    </section>
    <section class="screen" id="screen-lib">
      <div class="lib-head">
        <h2>Base locale</h2>
        <span class="lib-count" id="libCount">0 fruits</span>
      </div>
      <div id="libList"></div>
      <button class="btn btn-ghost" id="exportBtn" style="margin-top:14px">Exporter la base (.zip)</button>
    </section>
  </main>
  <nav>
    <button class="active" data-nav="capture"><span class="ni">📷</span>Capture</button>
    <button data-nav="lib"><span class="ni">🗂️</span>Base</button>
  </nav>
</div>
<div class="cam" id="cam">
  <div class="cam-top">
    <div>
      <div class="ctitle" id="camTitle">Face 1</div>
      <div class="csub" id="camSub">Échantillon 1</div>
    </div>
    <button class="cam-close" id="camClose">✕</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <div class="cam-guide"></div>
  <div class="cam-bottom"><div class="shutter" id="shutter"></div></div>
</div>
<canvas id="canvas"></canvas>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const FACES = ["Face 1", "Face 2", "Face 3", "Face 4"];
let currentPhotos = {};
let activeFace = null;
let stream = null;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("palmvision", 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("samples"))
        d.createObjectStore("samples", { keyPath: "id" });
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e);
  });
}
function saveSample(obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction("samples", "readwrite");
    tx.objectStore("samples").put(obj);
    tx.oncomplete = res; tx.onerror = rej;
  });
}
function getAllSamples() {
  return new Promise((res, rej) => {
    const tx = db.transaction("samples", "readonly");
    const rq = tx.objectStore("samples").getAll();
    rq.onsuccess = () => res(rq.result.sort((a,b)=>a.no-b.no));
    rq.onerror = rej;
  });
}
function updateNet() {
  const on = navigator.onLine;
  const d = document.getElementById("netdot");
  d.classList.toggle("online", on);
  document.getElementById("netlabel").textContent = on ? "En ligne" : "Hors ligne";
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);
function renderFaceGrid() {
  const g = document.getElementById("faceGrid");
  g.innerHTML = "";
  FACES.forEach((f, i) => {
    const cell = document.createElement("div");
    cell.className = "face-cell" + (currentPhotos[i] ? " done" : "");
    cell.innerHTML = currentPhotos[i]
      ? `<img src="${currentPhotos[i]}"><div class="check">✓</div><div class="retake">Reprendre</div>`
      : `<div class="ico">📷</div><div class="n">${f}</div><div class="check">✓</div>`;
    cell.onclick = () => openCamera(i);
    g.appendChild(cell);
  });
  const ready = Object.keys(currentPhotos).length === 4 && getSampleNo();
  document.getElementById("saveBtn").disabled = !ready;
}
function getSampleNo() {
  const v = document.getElementById("sampleNo").value.trim();
  return v ? parseInt(v, 10) : null;
}
document.getElementById("sampleNo").addEventListener("input", renderFaceGrid);
async function openCamera(faceIdx) {
  activeFace = faceIdx;
  const no = getSampleNo();
  if (!no) { toast("Saisis d'abord le numéro d'échantillon"); return; }
  document.getElementById("camTitle").textContent = FACES[faceIdx];
  document.getElementById("camSub").textContent = "Échantillon " + no;
  document.getElementById("cam").classList.add("active");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1920 } },
      audio: false
    });
    document.getElementById("video").srcObject = stream;
  } catch (e) {
    toast("Caméra inaccessible");
    closeCamera();
  }
}
function closeCamera() {
  document.getElementById("cam").classList.remove("active");
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
document.getElementById("camClose").onclick = closeCamera;
document.getElementById("shutter").onclick = () => {
  const v = document.getElementById("video");
  const c = document.getElementById("canvas");
  const size = Math.min(v.videoWidth, v.videoHeight);
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  const sx = (v.videoWidth - size) / 2, sy = (v.videoHeight - size) / 2;
  ctx.drawImage(v, sx, sy, size, size, 0, 0, size, size);
  currentPhotos[activeFace] = c.toDataURL("image/jpeg", 0.9);
  closeCamera();
  renderFaceGrid();
  toast(FACES[activeFace] + " capturée");
};
document.getElementById("saveBtn").onclick = async () => {
  const no = getSampleNo();
  const id = "Ech" + String(no).padStart(3, "0");
  const photos = FACES.map((_, i) => ({
    filename: `${id}_Face${i+1}.jpg`,
    data: currentPhotos[i]
  }));
  const online = navigator.onLine;
  const sample = { id, no, photos, createdAt: new Date().toISOString(), cloudSynced: false };
  await saveSample(sample);
  showConfirm(sample, online);
  currentPhotos = {};
};
function showConfirm(sample, online) {
  document.getElementById("confirmTitle").textContent = `Échantillon ${sample.no} enregistré`;
  const list = document.getElementById("savedList");
  list.innerHTML = sample.photos.map(p =>
    `<div class="saved-row"><span class="tick">✓</span> ${p.filename.replace(sample.id+"_","").replace(".jpg","")}<span class="fn">${p.filename}</span></div>`
  ).join("");
  const tags = document.getElementById("storageTags");
  tags.innerHTML =
    `<div class="tag on">✓ Téléphone (local)</div>` +
    (online
      ? `<div class="tag off">☁ Cloud : en attente de config</div>`
      : `<div class="tag off">☁ Cloud : hors ligne</div>`);
  showScreen("confirm");
  refreshLib();
}
document.getElementById("nextSampleBtn").onclick = () => {
  const cur = getSampleNo();
  document.getElementById("sampleNo").value = cur ? cur + 1 : "";
  renderFaceGrid();
  showScreen("capture");
};
async function refreshLib() {
  const samples = await getAllSamples();
  document.getElementById("libCount").textContent =
    samples.length + (samples.length > 1 ? " fruits" : " fruit");
  const list = document.getElementById("libList");
  if (!samples.length) {
    list.innerHTML = `<div class="lib-empty">Aucun échantillon pour l'instant.<br>Capture ton premier fruit depuis l'onglet Capture.</div>`;
    return;
  }
  list.innerHTML = samples.map(s => `
    <div class="lib-item">
      <img class="lib-thumb" src="${s.photos[0].data}">
      <div class="lib-meta">
        <b>${s.id}</b>
        <small>4 faces · ${new Date(s.createdAt).toLocaleDateString('fr-FR')} ·
          <span class="cloud ${s.cloudSynced?'synced':''}">${s.cloudSynced?'☁ synchronisé':'☁ local'}</span>
        </small>
      </div>
    </div>`).join("");
}
document.getElementById("exportBtn").onclick = async () => {
  const samples = await getAllSamples();
  if (!samples.length) { toast("Base vide"); return; }
  toast("Préparation de l'export…");
  const zip = new JSZip();
  samples.forEach(s => {
    s.photos.forEach(p => {
      const b64 = p.data.split(",")[1];
      zip.file(p.filename, b64, { base64: true });
    });
  });
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "palmvision_base.zip";
  a.click();
};
function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.nav === name || (name==="confirm" && b.dataset.nav==="capture")));
}
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => { showScreen(b.dataset.nav); if (b.dataset.nav === "lib") refreshLib(); };
});
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
(async function() {
  await openDB();
  updateNet();
  renderFaceGrid();
  refreshLib();
})();
</script>
</body>
</html>
